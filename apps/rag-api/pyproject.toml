[project]
name = "aegis-rag-api"
version = "0.1.0"
description = "Offline-first FastAPI service for Aegis retrieval and grounding."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13.4",
  "chromadb>=1.0.9",
  "fastapi>=0.115.12",
  "markdown>=3.8",
  "numpy>=2.2.6",
  "pydantic>=2.11.4",
  "pypdf>=5.5.0",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.20",
  "uvicorn>=0.34.2"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.5"
]
embeddings = [
  "sentence-transformers>=4.1.0"
]

[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
