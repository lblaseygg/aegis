offline_mode: true

network:
  ollama_base_url: http://127.0.0.1:11434
  rag_api_base_url: http://127.0.0.1:8088

runtime:
  mode: local
  model: gemma3:4b
  selection: auto
  model_profiles:
    fast_general: phi4-mini
    long_running: qwen3:8b
    coding_optimized: qwen2.5-coder:7b
    coding_fast: qwen2.5-coder:3b
    coding_strong: qwen2.5-coder:7b
  collection: default
  embedding_provider: hash

rag:
  chunk_size: 900
  chunk_overlap: 150
  min_chunk_chars: 200
  retrieval:
    top_k: 6
    score_threshold: 0.45
    rerank: false

audit:
  log_prompts: false
  log_responses: false
  log_source_paths: true
  log_document_hashes: true
  log_errors: true
