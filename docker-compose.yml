services:
  ollama:
    image: ollama/ollama:0.6.8
    container_name: aegis-ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute, utility
    volumes:
      - ./data/ollama:/root/.ollama
    gpus: all
    restart: unless-stopped

  rag-api:
    build:
      context: ./apps/rag-api
      dockerfile: Dockerfile
    container_name: aegis-rag-api
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      CHROMA_PATH: /data/chroma
      DOCUMENT_PATH: /data/documents
      AUDIT_LOG_PATH: /data/audit/audit.jsonl
      OFFLINE_MODE: "true"
      EMBEDDING_PROVIDER: hash
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./data/chroma:/data/chroma
      - ./data/documents:/data/documents
      - ./data/audit:/data/audit
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: ./docker/cli/Dockerfile
    container_name: aegis-cli
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      RAG_API_BASE_URL: http://rag-api:8088
      AEGIS_CONFIG_PATH: /data/config/config.yaml
      AEGIS_AUDIT_LOG_PATH: /data/audit/audit.jsonl
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - rag-api
    profiles:
      - cli
